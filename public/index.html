<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>📚 Campus Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <h1>📚 Campus Library</h1>
      <p class="subtitle">Authors and their books — powered by GraphQL</p>
    </div>

    <!-- Main Container -->
    <div class="container">
      <!-- Authors and Books List -->
      <div id="list" class="loading">
        <div class="loader"></div>
        <p>Loading books...</p>
      </div>

      <!-- Add Book Form -->
      <div class="form-card">
        <h3>➕ Add New Book</h3>
        <form id="addForm">
          <div class="form-group">
            <label for="title">Book Title</label>
            <input
              id="title"
              type="text"
              placeholder="Enter book title"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="year">Year</label>
              <input
                id="year"
                type="number"
                placeholder="2024"
                min="1900"
                max="2100"
              />
            </div>

            <div class="form-group">
              <label for="authorId">Author</label>
              <select id="authorId" required>
                <option value="">Select Author</option>
                <option value="1">Asha Patel</option>
                <option value="2">Ravi Kumar</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn-primary">
            Add Book
          </button>
        </form>
      </div>
    </div>

    <script>
      const GRAPHQL_URL = "http://localhost:4000/";

      // GraphQL request bhejne ka helper function
      async function gql(query, variables) {
        const res = await fetch(GRAPHQL_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ query, variables }),
        });

        const json = await res.json();

        if (json.errors) {
          throw new Error(json.errors[0].message);
        }

        return json.data;
      }

      
      // Load author and book
      
      async function loadAuthorsAndBooks() {
        const listDiv = document.getElementById('list');

        try {
          // GraphQL query: authors aur unki books fetch karo
          const data = await gql(`
            query {
              authors {
                id
                name
                country
                books {
                  id
                  title
                  year
                }
              }
            }
          `);

          // Display authors and their books
          listDiv.innerHTML = data.authors.map(author => `
            <div class="author-card">
              <div class="author-header">
                <h2>👤 ${author.name}</h2>
                <span class="country-badge">${author.country || 'Unknown'}</span>
              </div>

              <div class="books-list">
                ${author.books.length > 0
                  ? author.books.map(book => `
                      <div class="book-item">
                        <div class="book-info">
                          <span class="book-title">${book.title}</span>
                          <span class="book-year">${book.year || 'N/A'}</span>
                        </div>
                        <button
                          class="btn-delete"
                          onclick="deleteBook('${book.id}')"
                          title="Delete this book"
                        >
                          🗑️
                        </button>
                      </div>
                    `).join('')
                  : '<p class="no-books">No books yet</p>'
                }
              </div>
            </div>
          `).join('');

        } catch (error) {
          listDiv.innerHTML = `
            <div class="error-message">
              ❌ Error: ${error.message}
              <br><br>
              <button onclick="loadAuthorsAndBooks()" class="btn-primary">
                Try Again
              </button>
            </div>
          `;
        }
      }

      // ==================================
      // Book Delete karo (GraphQL Mutation)
      // ==================================
      async function deleteBook(id) {
        if (!confirm('Are you sure you want to delete this book?')) {
          return;
        }

        try {
          const data = await gql(`
            mutation DeleteBook($id: ID!) {
              deleteBook(id: $id)
            }
          `, { id: String(id) });

          if (data.deleteBook) {
            showMessage('✅ Book deleted successfully!', 'success');
            await loadAuthorsAndBooks();
          } else {
            showMessage('❌ Book not found', 'error');
          }
        } catch (error) {
          showMessage('❌ Error: ' + error.message, 'error');
        }
      }

      // ==================================
      // Naya Book Add karo (GraphQL Mutation)
      // ==================================
      document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = document.getElementById('title').value.trim();
        const yearInput = document.getElementById('year').value;
        const authorId = document.getElementById('authorId').value;

        // Validation
        if (!title || !authorId) {
          showMessage('❌ Please fill all required fields', 'error');
          return;
        }

        const year = yearInput === "" ? null : Number(yearInput);

        try {
          await gql(`
            mutation($t: String!, $y: Int, $a: ID!) {
              addBook(title: $t, year: $y, authorId: $a) {
                id
                title
              }
            }
          `, {
            t: title,
            y: year,
            a: authorId,
          });

          // Form clear karo
          e.target.reset();

          // List reload karo
          await loadAuthorsAndBooks();

          // Success message
          showMessage('✅ Book added successfully!', 'success');

        } catch (error) {
          showMessage('❌ Error: ' + error.message, 'error');
        }
      });

      // ==================================
      // Toast Notification
      // ==================================
      function showMessage(message, type) {
        // Existing message remove karo
        const existing = document.querySelector('.toast-message');
        if (existing) {
          existing.remove();
        }

        // Naya message create karo
        const toast = document.createElement('div');
        toast.className = `toast-message toast-${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);

        // 3 seconds baad auto remove
        setTimeout(() => {
          toast.classList.add('fade-out');
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // ==================================
      // Page load hote hi data fetch karo
      // ==================================
      loadAuthorsAndBooks();
    </script>
  </body>
</html>
